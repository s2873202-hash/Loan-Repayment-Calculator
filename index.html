<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業貸款還款試算機</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 標頭 -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 flex items-center gap-3">
          <i class="fa-solid fa-calculator text-blue-600"></i>
          貸款還款試算機
        </h1>
        <p class="text-slate-500 text-sm mt-1">精確計算每期還款金額、利息總額與還款計劃表（自動儲存上次輸入）</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="saved-badge" class="hidden text-xs bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-check text-xs"></i> 已載入上次輸入紀錄
        </span>
        <button id="btn-reset-default" class="text-xs text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i> 恢復預設值
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左側：輸入表單 (5 欄) -->
      <section class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
        <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-500"></i> 試算條件設定
        </h2>

        <!-- 貸款金額 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" for="loan-amount">
            貸款金額 (萬元)
          </label>
          <div class="relative">
            <input type="number" id="loan-amount" min="1" max="100000" step="1" value="1000"
              class="w-full pl-4 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">萬元</span>
          </div>
          <!-- 快捷金額按鈕 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="100">100萬</button>
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="500">500萬</button>
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="1000">1000萬</button>
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="1500">1500萬</button>
          </div>
        </div>

        <!-- 年利率 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" for="annual-rate">
            年利率 (%)
          </label>
          <div class="relative">
            <input type="number" id="annual-rate" min="0.01" max="30" step="0.01" value="2.15"
              class="w-full pl-4 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">%</span>
          </div>
          <!-- 快捷利率預設 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" class="btn-quick-rate text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="2.185">新青安 2.185%</button>
            <button type="button" class="btn-quick-rate text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="2.15">首購房貸 2.15%</button>
            <button type="button" class="btn-quick-rate text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="3.5">信貸/車貸 3.5%</button>
          </div>
        </div>

        <!-- 還款年限與月數 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-semibold text-slate-700" for="loan-years">還款期數</label>
            <span id="loan-months-text" class="text-xs text-blue-600 font-medium">共 360 期 (30年)</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="relative">
              <input type="number" id="loan-years" min="1" max="50" step="1" value="30"
                class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">年</span>
            </div>
            <div class="relative">
              <input type="number" id="loan-months-extra" min="0" max="11" step="1" value="0"
                class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">個月</span>
            </div>
          </div>
          <!-- 快捷期數 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" class="btn-quick-period text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-years="20">20年 (240期)</button>
            <button type="button" class="btn-quick-period text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-years="30">30年 (360期)</button>
            <button type="button" class="btn-quick-period text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-years="40">40年 (480期)</button>
          </div>
        </div>

        <!-- 還款方式 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">還款方式</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer border border-slate-200 rounded-xl p-3 flex flex-col justify-between hover:border-blue-300 transition bg-slate-50 has-[:checked]:bg-blue-50/50 has-[:checked]:border-blue-500 has-[:checked]:ring-1 has-[:checked]:ring-blue-500">
              <div class="flex items-center gap-2 mb-1">
                <input type="radio" name="repay-type" value="equal-installment" class="text-blue-600 focus:ring-blue-500" checked>
                <span class="text-sm font-bold text-slate-800">本息平均攤還</span>
              </div>
              <span class="text-[11px] text-slate-500 leading-tight">每月繳款金額固定，前期利息較高</span>
            </label>
            <label class="cursor-pointer border border-slate-200 rounded-xl p-3 flex flex-col justify-between hover:border-blue-300 transition bg-slate-50 has-[:checked]:bg-blue-50/50 has-[:checked]:border-blue-500 has-[:checked]:ring-1 has-[:checked]:ring-blue-500">
              <div class="flex items-center gap-2 mb-1">
                <input type="radio" name="repay-type" value="equal-principal" class="text-blue-600 focus:ring-blue-500">
                <span class="text-sm font-bold text-slate-800">本金平均攤還</span>
              </div>
              <span class="text-[11px] text-slate-500 leading-tight">每期本金固定，每月繳款金額逐期遞減</span>
            </label>
          </div>
        </div>

        <!-- 寬限期 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" for="grace-period">
            寬限期 (只繳利息不還本金)
          </label>
          <div class="relative">
            <input type="number" id="grace-period" min="0" max="10" step="1" value="0"
              class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">年</span>
          </div>
        </div>
      </section>

      <!-- 右側：計算結果與圖表 (7 欄) -->
      <section class="lg:col-span-7 space-y-6">
        
        <!-- 核心統計數據卡片 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 首期還款 -->
          <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 text-white/10 text-7xl font-bold">
              <i class="fa-solid fa-coins"></i>
            </div>
            <p class="text-xs font-medium text-blue-100 uppercase tracking-wider mb-1">首期付款金額</p>
            <div class="flex items-baseline gap-1">
              <span class="text-3xl font-extrabold tracking-tight" id="first-payment">0</span>
              <span class="text-sm font-medium text-blue-100">元/月</span>
            </div>
            <p class="text-[11px] text-blue-200 mt-2" id="first-payment-sub">包含本金與利息</p>
          </div>

          <!-- 總繳利息 -->
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 relative overflow-hidden">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">累積總利息</p>
            <div class="flex items-baseline gap-1">
              <span class="text-3xl font-extrabold text-rose-500 tracking-tight" id="total-interest">0</span>
              <span class="text-sm font-medium text-slate-500">萬元</span>
            </div>
            <div class="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
              <div id="interest-ratio-bar" class="bg-rose-500 h-full w-0 transition-all duration-500"></div>
            </div>
            <p class="text-[11px] text-slate-500 mt-1.5 flex justify-between">
              <span>利息佔總還款比：</span>
              <span id="interest-ratio-text" class="font-bold text-rose-500">0%</span>
            </p>
          </div>

          <!-- 總還款金額 -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <p class="text-xs font-semibold text-slate-400 mb-1">本息總還款金額</p>
            <p class="text-xl font-bold text-slate-800"><span id="total-repayment">0</span> <span class="text-xs text-slate-500 font-normal">萬元</span></p>
          </div>

          <!-- 末期還款 -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <p class="text-xs font-semibold text-slate-400 mb-1">末期付款金額</p>
            <p class="text-xl font-bold text-slate-800"><span id="last-payment">0</span> <span class="text-xs text-slate-500 font-normal">元/月</span></p>
          </div>
        </div>

        <!-- 圖表區域 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-chart-pie text-blue-500"></i> 還款比例與趨勢分析
            </h3>
            <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-medium">
              <button id="btn-chart-pie" class="px-3 py-1 rounded-lg bg-white shadow-xs text-blue-600 transition">佔比分析</button>
              <button id="btn-chart-line" class="px-3 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition">餘額趨勢</button>
            </div>
          </div>

          <div class="relative h-64 w-full flex items-center justify-center">
            <canvas id="loanChart"></canvas>
          </div>
        </div>

      </section>
    </div>

    <!-- 完整分期還款表 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-blue-500"></i> 分期還款明細表
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">點擊可查看每一期的還款金額、利息、本金與累積殘額</p>
        </div>
        <button id="btn-export-csv" class="self-start sm:self-auto text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-csv text-emerald-600 text-sm"></i> 匯出 CSV 試算表
        </button>
      </div>

      <!-- 表格區域 -->
      <div class="overflow-x-auto max-h-96 rounded-xl border border-slate-100">
        <table class="w-full text-sm text-left text-slate-600">
          <thead class="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0 border-b border-slate-100 font-semibold">
            <tr>
              <th scope="col" class="px-4 py-3">期數</th>
              <th scope="col" class="px-4 py-3">償還本息 (元)</th>
              <th scope="col" class="px-4 py-3">償還本金 (元)</th>
              <th scope="col" class="px-4 py-3">償還利息 (元)</th>
              <th scope="col" class="px-4 py-3">剩餘本金 (萬元)</th>
            </tr>
          </thead>
          <tbody id="schedule-table-body" class="divide-y divide-slate-100">
            <!-- 程式動態渲染內容 -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // 定義 localStorage 金鑰名稱
    const STORAGE_KEY = 'loan_calculator_user_data_v1';

    // DOM 元素引用
    const loanAmountInput = document.getElementById('loan-amount');
    const annualRateInput = document.getElementById('annual-rate');
    const loanYearsInput = document.getElementById('loan-years');
    const loanMonthsExtraInput = document.getElementById('loan-months-extra');
    const gracePeriodInput = document.getElementById('grace-period');
    const repayTypeInputs = document.querySelectorAll('input[name="repay-type"]');
    
    const loanMonthsText = document.getElementById('loan-months-text');
    const firstPaymentEl = document.getElementById('first-payment');
    const lastPaymentEl = document.getElementById('last-payment');
    const totalInterestEl = document.getElementById('total-interest');
    const totalRepaymentEl = document.getElementById('total-repayment');
    const firstPaymentSub = document.getElementById('first-payment-sub');
    const interestRatioBar = document.getElementById('interest-ratio-bar');
    const interestRatioText = document.getElementById('interest-ratio-text');
    const scheduleTableBody = document.getElementById('schedule-table-body');
    const savedBadge = document.getElementById('saved-badge');
    const btnResetDefault = document.getElementById('btn-reset-default');

    let currentSchedule = [];
    let chartInstance = null;
    let currentChartType = 'pie';

    // 格式化數字 (千分位)
    function formatNumber(num) {
      return Math.round(num).toLocaleString('zh-TW');
    }

    // 格式化金額為萬元 (保留小數點第二位)
    function formatTenThousand(num) {
      return (num / 10000).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 取得當前的選取還款類型
    function getSelectedRepayType() {
      let selected = 'equal-installment';
      repayTypeInputs.forEach(r => { if (r.checked) selected = r.value; });
      return selected;
    }

    // 將當前欄位輸入值儲存至 localStorage
    function saveInputsToStorage() {
      const data = {
        amount: loanAmountInput.value,
        rate: annualRateInput.value,
        years: loanYearsInput.value,
        monthsExtra: loanMonthsExtraInput.value,
        graceYears: gracePeriodInput.value,
        repayType: getSelectedRepayType()
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('無法儲存至 localStorage:', e);
      }
    }

    // 從 localStorage 載入數據
    function loadInputsFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = JSON.parse(saved);
          if (data.amount !== undefined) loanAmountInput.value = data.amount;
          if (data.rate !== undefined) annualRateInput.value = data.rate;
          if (data.years !== undefined) loanYearsInput.value = data.years;
          if (data.monthsExtra !== undefined) loanMonthsExtraInput.value = data.monthsExtra;
          if (data.graceYears !== undefined) gracePeriodInput.value = data.graceYears;
          if (data.repayType) {
            repayTypeInputs.forEach(r => {
              r.checked = (r.value === data.repayType);
            });
          }
          savedBadge.classList.remove('hidden');
          return true;
        }
      } catch (e) {
        console.warn('載入 localStorage 數據失敗:', e);
      }
      return false;
    }

    // 主計算邏輯
    function calculateLoan() {
      // 讀取數值與安全邊界處理
      const principalTenThousand = parseFloat(loanAmountInput.value) || 0;
      const principal = principalTenThousand * 10000;
      const annualRate = (parseFloat(annualRateInput.value) || 0) / 100;
      const monthlyRate = annualRate / 12;
      
      const years = parseInt(loanYearsInput.value) || 0;
      const monthsExtra = parseInt(loanMonthsExtraInput.value) || 0;
      const totalMonths = (years * 12) + monthsExtra;

      const graceYears = parseInt(gracePeriodInput.value) || 0;
      let graceMonths = graceYears * 12;

      // 期數提示文字更新
      loanMonthsText.textContent = `共 ${totalMonths} 期 (${years}年${monthsExtra > 0 ? monthsExtra + '月' : ''})`;

      // 檢查異常狀況
      if (principal <= 0 || totalMonths <= 0) {
        firstPaymentEl.textContent = '0';
        lastPaymentEl.textContent = '0';
        totalInterestEl.textContent = '0';
        totalRepaymentEl.textContent = '0';
        scheduleTableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-slate-400">請輸入有效的貸款金額與期數</td></tr>';
        return;
      }

      if (graceMonths >= totalMonths) {
        graceMonths = totalMonths - 1;
      }

      const repayType = getSelectedRepayType();
      const amortMonths = totalMonths - graceMonths; // 真正攤還本金的月數
      
      let schedule = [];
      let currentBalance = principal;
      let totalInterest = 0;

      // 本息平均攤還公式輔助計算
      let monthlyPaymentAmort = 0;
      if (repayType === 'equal-installment' && amortMonths > 0) {
        if (monthlyRate > 0) {
          monthlyPaymentAmort = (principal * monthlyRate * Math.pow(1 + monthlyRate, amortMonths)) / (Math.pow(1 + monthlyRate, amortMonths) - 1);
        } else {
          monthlyPaymentAmort = principal / amortMonths;
        }
      }

      // 本金平均攤還每一期應還本金
      const fixedPrincipalPerMonth = amortMonths > 0 ? (principal / amortMonths) : 0;

      for (let month = 1; month <= totalMonths; month++) {
        let interestForMonth = currentBalance * monthlyRate;
        let principalForMonth = 0;

        if (month <= graceMonths) {
          // 寬限期內：只繳利息
          principalForMonth = 0;
        } else {
          // 寬限期後：開始償還本金
          if (repayType === 'equal-installment') {
            principalForMonth = monthlyPaymentAmort - interestForMonth;
          } else { // equal-principal
            principalForMonth = fixedPrincipalPerMonth;
          }
        }

        // 最後一期平差
        if (month === totalMonths) {
          principalForMonth = currentBalance;
        }

        let totalForMonth = principalForMonth + interestForMonth;
        currentBalance -= principalForMonth;
        if (currentBalance < 0) currentBalance = 0;

        totalInterest += interestForMonth;

        schedule.push({
          month: month,
          totalPayment: totalForMonth,
          principalPayment: principalForMonth,
          interestPayment: interestForMonth,
          remainingBalance: currentBalance,
          isGrace: month <= graceMonths
        });
      }

      currentSchedule = schedule;

      // 渲染結果面板
      const firstPayment = schedule[0]?.totalPayment || 0;
      const lastPayment = schedule[schedule.length - 1]?.totalPayment || 0;
      const grandTotalRepayment = principal + totalInterest;

      firstPaymentEl.textContent = formatNumber(firstPayment);
      lastPaymentEl.textContent = formatNumber(lastPayment);
      totalInterestEl.textContent = formatTenThousand(totalInterest);
      totalRepaymentEl.textContent = formatTenThousand(grandTotalRepayment);

      if (graceMonths > 0) {
        firstPaymentSub.textContent = `前 ${graceMonths} 期寬限期（只需繳納利息）`;
      } else {
        firstPaymentSub.textContent = repayType === 'equal-installment' ? '全期金額固定' : '隨本金遞減';
      }

      // 計算利息佔比
      const interestRatio = grandTotalRepayment > 0 ? (totalInterest / grandTotalRepayment) * 100 : 0;
      interestRatioBar.style.width = `${Math.min(interestRatio, 100)}%`;
      interestRatioText.textContent = `${interestRatio.toFixed(1)}%`;

      // 渲染表格與圖表
      renderScheduleTable(schedule);
      renderChart(principal, totalInterest, schedule);

      // 自動將本次輸入變更儲存至 localStorage
      saveInputsToStorage();
    }

    // 渲染明細表格
    function renderScheduleTable(schedule) {
      let html = '';
      schedule.forEach(item => {
        html += `
          <tr class="hover:bg-slate-50 transition ${item.isGrace ? 'bg-amber-50/30' : ''}">
            <td class="px-4 py-2.5 font-medium text-slate-800">
              第 ${item.month} 期 ${item.isGrace ? '<span class="text-[10px] text-amber-600 font-normal bg-amber-100 px-1.5 py-0.5 rounded ml-1">寬限期</span>' : ''}
            </td>
            <td class="px-4 py-2.5 font-semibold text-slate-900">${formatNumber(item.totalPayment)}</td>
            <td class="px-4 py-2.5 text-blue-600">${formatNumber(item.principalPayment)}</td>
            <td class="px-4 py-2.5 text-rose-500">${formatNumber(item.interestPayment)}</td>
            <td class="px-4 py-2.5 text-slate-500">${(item.remainingBalance / 10000).toFixed(2)}</td>
          </tr>
        `;
      });
      scheduleTableBody.innerHTML = html;
    }

    // 渲染 / 更新圖表
    function renderChart(principal, totalInterest, schedule) {
      const ctx = document.getElementById('loanChart').getContext('2d');
      if (chartInstance) {
        chartInstance.destroy();
      }

      if (currentChartType === 'pie') {
        // 圓餅圖：本金 vs 利息
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['貸款本金', '總支付利息'],
            datasets: [{
              data: [principal, totalInterest],
              backgroundColor: ['#3b82f6', '#f43f5e'],
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const value = context.raw || 0;
                    return ` ${context.label}: ${(value / 10000).toFixed(2)} 萬元`;
                  }
                }
              }
            }
          }
        });
      } else {
        // 折線圖：本金殘額趨勢
        const labels = schedule.map(s => `第${s.month}期`);
        const balances = schedule.map(s => (s.remainingBalance / 10000).toFixed(2));

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: '剩餘本金 (萬元)',
              data: balances,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              fill: true,
              tension: 0.2,
              pointRadius: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              x: { grid: { display: false }, ticks: { maxTicksLimit: 12 } },
              y: { beginAtZero: true }
            }
          }
        });
      }
    }

    // 導出 CSV 功能
    function exportToCSV() {
      if (!currentSchedule || currentSchedule.length === 0) return;

      let csv = '\uFEFF'; // UTF-8 BOM
      csv += '期數,償還本息(元),償還本金(元),償還利息(元),剩餘本金(萬元)\n';

      currentSchedule.forEach(item => {
        csv += `${item.month},${Math.round(item.totalPayment)},${Math.round(item.principalPayment)},${Math.round(item.interestPayment)},${(item.remainingBalance / 10000).toFixed(2)}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `貸款還款明細試算表.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 事件監聽與綁定
    function initEvents() {
      // 輸入欄位實時計算與記錄
      const inputs = [loanAmountInput, annualRateInput, loanYearsInput, loanMonthsExtraInput, gracePeriodInput];
      inputs.forEach(input => {
        input.addEventListener('input', calculateLoan);
        input.addEventListener('change', calculateLoan);
      });

      repayTypeInputs.forEach(r => {
        r.addEventListener('change', calculateLoan);
      });

      // 快捷按鈕事件
      document.querySelectorAll('.btn-quick-amount').forEach(btn => {
        btn.addEventListener('click', () => {
          loanAmountInput.value = btn.dataset.val;
          calculateLoan();
        });
      });

      document.querySelectorAll('.btn-quick-rate').forEach(btn => {
        btn.addEventListener('click', () => {
          annualRateInput.value = btn.dataset.val;
          calculateLoan();
        });
      });

      document.querySelectorAll('.btn-quick-period').forEach(btn => {
        btn.addEventListener('click', () => {
          loanYearsInput.value = btn.dataset.years;
          loanMonthsExtraInput.value = 0;
          calculateLoan();
        });
      });

      // 圖表切換按鈕
      const btnPie = document.getElementById('btn-chart-pie');
      const btnLine = document.getElementById('btn-chart-line');

      btnPie.addEventListener('click', () => {
        currentChartType = 'pie';
        btnPie.className = 'px-3 py-1 rounded-lg bg-white shadow-xs text-blue-600 transition';
        btnLine.className = 'px-3 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition';
        calculateLoan();
      });

      btnLine.addEventListener('click', () => {
        currentChartType = 'line';
        btnLine.className = 'px-3 py-1 rounded-lg bg-white shadow-xs text-blue-600 transition';
        btnPie.className = 'px-3 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition';
        calculateLoan();
      });

      // 匯出 CSV 按鈕
      document.getElementById('btn-export-csv').addEventListener('click', exportToCSV);

      // 重置為預設值按鈕
      btnResetDefault.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        loanAmountInput.value = 1000;
        annualRateInput.value = 2.15;
        loanYearsInput.value = 30;
        loanMonthsExtraInput.value = 0;
        gracePeriodInput.value = 0;
        repayTypeInputs[0].checked = true;
        savedBadge.classList.add('hidden');
        calculateLoan();
      });
    }

    // 初始化應用程式
    document.addEventListener('DOMContentLoaded', () => {
      loadInputsFromStorage();
      initEvents();
      calculateLoan();
    });
  </script>
</body>
</html>
